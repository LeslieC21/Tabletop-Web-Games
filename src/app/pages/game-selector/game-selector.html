<div class="container">
    <h1>Table-top Web Games!</h1>
    <ul>
        @for(game of Games; track $index) {
            <li>
                <button [routerLink]="['/GameLobby', `${game.title}`]">
                    <span>{{ game.title }}</span>
                    <img src="/Blackjack-cards.png" alt="playing card" height="150px" width="150px"/>
                </button>
            </li>
        }
    </ul>
</div>
